[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goal-native"
version = "0.1.0"
description = "Local-first goal-native incremental AI execution harness"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = []

[project.scripts]
goal-native = "goal_native.__main__:main"

[tool.setuptools]
packages = ["goal_native"]

[tool.setuptools.data-files]
"share/goal-native/web" = ["web/index.html", "web/app.js", "web/style.css"]
